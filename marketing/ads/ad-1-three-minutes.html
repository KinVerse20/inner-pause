<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Inner Pause ad 1: Three minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Instagram ad, concept 1: calm on deep navy. #feed = 1080 x 1350 (4:5),
     #story = 1080 x 1920 (9:16, text kept clear of the top 250 px and
     bottom 340 px where Instagram draws its own controls). */
  :root { --w: 1080px; --h: 1350px; }
  html.story { --h: 1920px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #f8fafc; }
  .ad {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    background: radial-gradient(120% 70% at 50% 8%, #3d3694 0%, #262357 42%, #16143a 100%);
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 96px 90px 88px;
  }
  html.story .ad { padding: 270px 90px 360px; justify-content: center; }
  .ad > * { flex-shrink: 0; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb.a { width: 620px; height: 620px; left: -260px; top: 120px; background: #6d5bd0; opacity: .55; }
  .orb.b { width: 560px; height: 560px; right: -240px; bottom: -200px; background: #e0a868; opacity: .32; }
  .wordmark { position: relative; font-size: 30px; font-weight: 600; letter-spacing: .42em; color: #c4b5fd; text-indent: .42em; }
  .rings { position: relative; width: 340px; height: 340px; margin-top: 46px; }
  html.story .rings { width: 520px; height: 520px; margin-top: 80px; }
  .rings::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(196,181,253,.32), transparent 68%); }
  .rings svg { position: relative; width: 100%; height: 100%; }
  h1 { position: relative; margin-top: 40px; font-size: 82px; line-height: 1.04; font-weight: 600; letter-spacing: -0.025em; }
  html.story h1 { margin-top: 80px; font-size: 96px; }
  h1 em { font-style: normal; color: #c4b5fd; }
  .sub { position: relative; margin-top: 22px; font-size: 32px; line-height: 1.4; color: rgba(248,250,252,.74); max-width: 820px; }
  .breath { position: relative; margin-top: 28px; display: inline-flex; align-items: center; gap: 18px; padding: 16px 30px; border-radius: 999px; background: rgba(248,250,252,.08); border: 1.5px solid rgba(196,181,253,.3); font-size: 28px; font-weight: 500; color: #ddd6fe; }
  .breath b { color: #fff; font-weight: 600; }
  .breath i { width: 10px; height: 10px; border-radius: 50%; background: #c4b5fd; display: inline-block; }
  .spacer { flex: 1 1 auto; min-height: 24px; }
  html.story .spacer { flex: 0; height: 90px; }
  .cta { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 108px; padding: 0 64px; border-radius: 999px; background: #c4b5fd; color: #1d1b4c; font-size: 38px; font-weight: 700; box-shadow: 0 24px 60px rgba(196,181,253,.35); }
  .price { position: relative; margin-top: 24px; font-size: 26px; color: rgba(248,250,252,.7); }
  .price s { opacity: .8; }
  .price b { color: #fff; font-weight: 600; }
</style>
<script>if (location.hash === "#story") document.documentElement.classList.add("story");</script>
</head>
<body>
  <main class="ad">
    <span class="orb a"></span><span class="orb b"></span>
    <p class="wordmark">INNER PAUSE</p>
    <div class="rings">
      <!-- The Harmony Form, locked geometry (docs/BRAND_IDENTITY.md 6.1), dark version. -->
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle cx="106" cy="112" r="86" stroke="#4338CA" stroke-width="3" opacity=".5" fill="none" />
        <circle cx="134" cy="110" r="84" stroke="#7C6AED" stroke-width="3.5" opacity=".65" fill="none" />
        <circle cx="112" cy="134" r="82" stroke="#C4B5FD" stroke-width="4" opacity=".8" fill="none" />
        <circle cx="128" cy="128" r="80" stroke="#F8FAFC" stroke-width="4.5" opacity=".95" fill="none" />
        <rect x="94" y="82" width="18" height="76" rx="9" fill="#F8FAFC" />
        <rect x="128" y="82" width="18" height="76" rx="9" fill="#F8FAFC" />
      </svg>
    </div>
    <h1>Your mind,<br /><em>three minutes</em><br />from now.</h1>
    <p class="sub">Short guided Pauses of sound and breath, for the moments the day gets loud.</p>
    <p class="breath"><i></i>Breathe in <b>4</b> · out <b>6</b></p>
    <div class="spacer"></div>
    <p class="cta">Try 2 Pauses free</p>
    <p class="price">Then <s>₹2,000</s> <b>₹1,000</b> a year · launch offer</p>
  </main>
</body>
</html>
